<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>60-Second Blitz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&family=Newsreader:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e4e8e3; --ink:#1c2a28; --muted:#52615e; --btn:#1c2a28; --btnink:#f3f5f2; --line:#bcc6c0;
  --paper:#fffef9; --paperink:#25302e; --ok:#4f9a63; --okbg:#e3f1e6; --bad:#a4473f; --badbg:#f6e2df; --bar:#3f7f86;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#17201e;--ink:#e8ede9;--muted:#9fb0ab;--btn:#e8ede9;--btnink:#17201e;--line:#34443f;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#17201e;--ink:#e8ede9;--muted:#9fb0ab;--btn:#e8ede9;--btnink:#17201e;--line:#34443f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.wrap{max-width:580px;margin:0 auto;padding:36px 18px 56px}
h1{font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:clamp(32px,8vw,48px);line-height:1.05;margin:0 0 8px}
.sub{margin:0 0 22px;color:var(--muted)}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid #e0a82e;outline-offset:3px}
.group{margin:20px 0 22px}
.group h2{font-size:14px;font-weight:600;margin:0 0 8px;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 15px;border-radius:999px;border:1.5px solid var(--btn);background:transparent;color:var(--btn);font-weight:600;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btnink)}
.rules{margin:0 0 22px;padding:12px 14px;border-left:4px solid var(--bar);background:rgba(63,127,134,.12);border-radius:0 8px 8px 0;font-size:15px}
.go{padding:13px 28px;border-radius:999px;border:0;background:var(--btn);color:var(--btnink);font-weight:600;font-size:17px;cursor:pointer}
.ghost{padding:12px 22px;border-radius:999px;border:1.5px solid var(--btn);background:transparent;font-weight:600;font-size:15px;cursor:pointer}

.hud{display:flex;gap:22px;align-items:flex-end;margin-bottom:10px}
.stat{display:flex;flex-direction:column;line-height:1.15}
.stat small{font-size:13px;color:var(--muted)}
.stat b{font-family:"Newsreader",Georgia,serif;font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.stat.time{margin-right:auto}
.stat.time b.low{color:var(--bad)}
.track{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-bottom:18px}
.fill{height:100%;width:100%;background:var(--bar);border-radius:5px}
.fill.low{background:var(--bad)}
.word{background:var(--paper);color:var(--paperink);border-radius:14px;padding:26px 18px 30px;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.12);margin-bottom:14px}
.word small{display:block;font-size:13px;color:#5a6764;margin-bottom:4px}
.word b{display:block;font-family:"Newsreader",Georgia,serif;font-size:clamp(34px,9vw,50px);line-height:1.1;font-weight:600;overflow-wrap:anywhere}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;min-height:64px;padding:10px 14px;border-radius:12px;border:2px solid transparent;background:var(--paper);color:var(--paperink);font-size:17px;font-weight:600;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.12);overflow-wrap:anywhere}
.opt i{font-style:normal;flex:none;width:24px;height:24px;border-radius:6px;background:#e9ece6;color:#5a6764;font-size:13px;display:grid;place-items:center}
.opt:hover:not(:disabled){border-color:var(--bar)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{min-height:28px;margin:12px 0 0;font-weight:600;text-align:center}
.fb.ok{color:var(--ok)}
.fb.bad{color:var(--bad)}
@media (max-width:420px){.opts{grid-template-columns:1fr}}

.final{font-family:"Newsreader",Georgia,serif;font-size:64px;line-height:1;font-weight:600;margin:4px 0 4px}
.badge{display:inline-block;background:var(--ok);color:#fff;font-weight:600;font-size:13px;border-radius:999px;padding:3px 12px;margin-bottom:10px}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 20px}
.res div{padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.res small{display:block;font-size:13px;color:var(--muted)}
.res b{font-family:"Newsreader",Georgia,serif;font-size:24px;font-weight:600}
.missed{margin:0 0 20px}
.missed h2{font-size:15px;margin:0 0 8px}
.missed ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.missed li{background:var(--paper);color:var(--paperink);border-radius:8px;padding:8px 12px;font-size:15px}
.missed li b{font-weight:600}
.btns{display:flex;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<main class="wrap">
  <h1>60-Second Blitz</h1>

  <section id="start">
    <div class="group">
      <div class="chips" id="modes">
        <button type="button" class="chip" data-m="acc" aria-pressed="true">Accounting Terms</button>
        <button type="button" class="chip" data-m="verb" aria-pressed="false">Action Verbs</button>
        <button type="button" class="chip" data-m="all" aria-pressed="false">Semua kata</button>
      </div></div>
    <button type="button" class="go" id="startBtn">Mulai</button>
  </section>

  <section id="play" hidden>
    <div class="hud">
      <div class="stat time"><small>Waktu</small><b id="tv">60</b></div>
      <div class="stat"><small>Beruntun</small><b id="sk">0</b></div>
      <div class="stat"><small>Skor</small><b id="sc">0</b></div>
    </div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="word"><small id="wl">English</small><b id="wd">Receipt</b></div>
    <div class="opts" id="opts"></div>
    <p class="fb" id="fb" aria-live="polite"></p>
  </section>

  <section id="end" hidden>
    <p class="sub" style="margin:0">Waktu habis. Skor kamu:</p>
    <div class="final" id="fs">0</div>
    <div class="badge" id="rec" hidden>Rekor baru!</div>
    <div class="res">
      <div><small>Benar</small><b id="rc">0</b></div>
      <div><small>Akurasi</small><b id="ra">0%</b></div>
      <div><small>Beruntun terbaik</small><b id="rs">0</b></div>
    </div>
    <p class="sub" id="bestLine" style="margin:-8px 0 18px"></p>
    <div class="missed" id="missed" hidden><h2>Kata yang perlu diulang</h2><ul id="ml"></ul></div>
    <div class="btns">
      <button type="button" class="go" id="again">Main lagi</button>
      <button type="button" class="ghost" id="change">Ubah pilihan</button>
    </div>
  </section>
</main>
<script>
var VOC={
 acc:[["Receipt","Kuitansi"],["Invoice","Faktur"],["Payment","Pembayaran"],["Payment register","Daftar pembayaran"],["Expense","Pengeluaran"],["Financial report","Laporan keuangan"],["Sales report","Laporan penjualan"],["Amount","Jumlah uang"],["Records","Catatan"],["Copy","Salinan"]],
 verb:[["Request","Meminta"],["Send","Mengirim"],["Check","Memeriksa"],["Confirm","Mengonfirmasi"],["Correct","Memperbaiki"],["Report","Melaporkan"],["Review","Meninjau"],["Provide","Memberikan"],["Submit","Menyerahkan"],["Complete","Menyelesaikan"]]
};
var DURATION=60000, mode="acc", dir="en";
var running=false, locked=false, queue=[], cur=null, score=0, streak=0, bestStreak=0, correct=0, answered=0, missed=[], endAt=0, tick=null, nextT=null;
function $(id){return document.getElementById(id)}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function items(){
  var out=[];
  ["acc","verb"].forEach(function(cat){
    if(mode==="all"||mode===cat) VOC[cat].forEach(function(p,i){out.push({id:cat+i,cat:cat,en:p[0],id_:p[1]})});
  });
  return out;
}
function show(which){["start","play","end"].forEach(function(s){$(s).hidden=(s!==which)})}
function toggle(groupId,attr,btn){
  Array.prototype.forEach.call($(groupId).children,function(x){x.setAttribute("aria-pressed",x===btn?"true":"false")});
}
$("modes").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;mode=b.dataset.m;toggle("modes","m",b)});

function bestKey(){return "kilat60:"+mode+":"+dir}
function getBest(){try{return parseInt(localStorage.getItem(bestKey()),10)||0}catch(e){return 0}}
function setBest(v){try{localStorage.setItem(bestKey(),String(v))}catch(e){}}

function begin(){
  clearTimeout(nextT);clearInterval(tick);
  score=0;streak=0;bestStreak=0;correct=0;answered=0;missed=[];queue=[];locked=false;running=true;
  $("sc").textContent="0";$("sk").textContent="0";$("fb").textContent="";$("fb").className="fb";
  show("play");
  endAt=Date.now()+DURATION;
  tickTime();
  tick=setInterval(tickTime,100);
  nextQ();
}
function tickTime(){
  var left=Math.max(0,endAt-Date.now());
  var s=Math.ceil(left/1000);
  $("tv").textContent=s;
  $("fill").style.width=(left/DURATION*100)+"%";
  var low=left<=10000;
  $("tv").className=low?"low":"";
  $("fill").className=low?"fill low":"fill";
  if(left<=0) finish();
}
function nextQ(){
  if(!running) return;
  var all=items();
  if(!queue.length) queue=shuffle(all.slice());
  cur=queue.pop();
  var pool=shuffle(all.filter(function(x){return x.cat===cur.cat&&x.id!==cur.id}).concat([]));
  // pakai kata dari kategori yang sama sebagai pengecoh
  var full=VOC[cur.cat].map(function(p,i){return {id:cur.cat+i,en:p[0],id_:p[1]}}).filter(function(x){return x.id!==cur.id});
  var wrong=shuffle(full).slice(0,3);
  var opts=shuffle([cur].concat(wrong));
  var qEn=(dir==="en");
  $("wl").textContent=qEn?"English":"Bahasa Indonesia";
  $("wd").textContent=qEn?cur.en:cur.id_;
  var box=$("opts");box.innerHTML="";
  opts.forEach(function(o,i){
    var b=document.createElement("button");
    b.type="button";b.className="opt";b.dataset.id=o.id;
    b.innerHTML="<i>"+(i+1)+"</i><span></span>";
    b.lastChild.textContent=qEn?o.id_:o.en;
    b.addEventListener("click",function(){answer(b)});
    box.appendChild(b);
  });
  locked=false;
  $("fb").textContent="";$("fb").className="fb";
}
function answer(btn){
  if(!running||locked) return;
  locked=true;answered++;
  var ok=btn.dataset.id===cur.id;
  var btns=$("opts").children;
  Array.prototype.forEach.call(btns,function(b){
    b.disabled=true;
    if(b.dataset.id===cur.id) b.classList.add("ok");
  });
  var fb=$("fb");
  if(ok){
    streak++;correct++;
    if(streak>bestStreak) bestStreak=streak;
    var pts=10+Math.min(streak-1,8)*5;
    score+=pts;
    fb.textContent="+"+pts+(streak>1?"  ·  beruntun ×"+streak:"");
    fb.className="fb ok";
  }else{
    btn.classList.add("bad");
    streak=0;
    if(!missed.some(function(m){return m.id===cur.id})) missed.push(cur);
    fb.textContent=(dir==="en"?cur.en+" = "+cur.id_:cur.id_+" = "+cur.en);
    fb.className="fb bad";
  }
  $("sc").textContent=score;$("sk").textContent=streak;
  nextT=setTimeout(nextQ,ok?450:1100);
}
function finish(){
  if(!running) return;
  running=false;clearInterval(tick);clearTimeout(nextT);
  var prev=getBest(), isRec=score>prev&&score>0;
  if(isRec) setBest(score);
  $("fs").textContent=score;
  $("rec").hidden=!isRec;
  $("rc").textContent=correct;
  $("ra").textContent=answered?Math.round(correct/answered*100)+"%":"0%";
  $("rs").textContent=bestStreak;
  $("bestLine").textContent="Rekor terbaik untuk pilihan ini: "+Math.max(prev,score);
  var ml=$("ml");ml.innerHTML="";
  missed.forEach(function(m){
    var li=document.createElement("li");
    var b=document.createElement("b");b.textContent=m.en;
    li.appendChild(b);li.appendChild(document.createTextNode(" = "+m.id_));
    ml.appendChild(li);
  });
  $("missed").hidden=!missed.length;
  show("end");
}
document.addEventListener("keydown",function(e){
  if(!running||locked) return;
  var n=parseInt(e.key,10);
  if(n>=1&&n<=4){var b=$("opts").children[n-1];if(b)answer(b)}
});
$("startBtn").addEventListener("click",begin);
$("again").addEventListener("click",begin);
$("change").addEventListener("click",function(){show("start")});
</script>
</body>
</html>
